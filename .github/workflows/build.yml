name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/fastshare
          cat > settings.gradle <<'EOF1'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'FastShare'
          include ':app'
          EOF1
          cat > build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF2
          cat > gradle.properties <<'EOF3'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF3
          cat > app/build.gradle <<'EOF4'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.fastshare'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.fastshare'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-nearby:19.1.0'
          }
          EOF4
          cat > app/src/main/AndroidManifest.xml <<'EOF5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="نقل سريع"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF5
          cat > app/src/main/java/com/fastshare/MainActivity.kt <<'EOF6'
          package com.fastshare

          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.*
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream

          class MainActivity : Activity() {
              private val svc = "com.fastshare.svc"
              private val strat = Strategy.P2P_POINT_TO_POINT
              private val MATCH = LinearLayout.LayoutParams.MATCH_PARENT
              private val WRAP = LinearLayout.LayoutParams.WRAP_CONTENT
              private lateinit var client: ConnectionsClient
              private lateinit var status: TextView
              private lateinit var speed: TextView
              private lateinit var bar: ProgressBar
              private var statusText = "اختر: إرسال أو استقبال (على الجهازين)"
              private var speedText = ""
              private var progressVal = 0
              private var picked: List<Uri> = emptyList()
              private var sending = false
              private var pending: (() -> Unit)? = null
              private var t0 = 0L
              private val prog = HashMap<Long, Long>()
              private val names = HashMap<Long, String>()
              private val files = HashMap<Long, Payload>()
              private val done = HashSet<Long>()
              private val sentIds = HashSet<Long>()
              private val accents = intArrayOf(
                  0xFF1FA971.toInt(), 0xFF2F80ED.toInt(), 0xFF8E5CF7.toInt(), 0xFFF2994A.toInt())

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  client = Nearby.getConnectionsClient(this)
                  buildUi()
              }

              private fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()

              private fun prefs() = getSharedPreferences("s", 0)

              private fun accent(): Int = accents[prefs().getInt("acc", 0)]

              private fun isDark(): Boolean {
                  val v = prefs().getInt("dark", -1)
                  if (v >= 0) return v == 1
                  val m = resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                  return m == Configuration.UI_MODE_NIGHT_YES
              }

              private fun shade(c: Int): Int {
                  val h = FloatArray(3)
                  Color.colorToHSV(c, h)
                  h[2] = h[2] * 0.7f
                  return Color.HSVToColor(h)
              }

              private fun bg(c: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(c)
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun tv(t: String, size: Float, color: Int, bold: Boolean): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(null, Typeface.BOLD)
                  return v
              }

              private fun lp(w: Int, h: Int, top: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h)
                  p.topMargin = dp(top)
                  return p
              }

              private fun action(e: String, t: String, s: String, filled: Boolean,
                                 cardC: Int, txt: Int, sub: Int, onClick: () -> Unit): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(22), dp(22), dp(22), dp(22))
                  val ac = accent()
                  if (filled) {
                      val g = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(ac, shade(ac)))
                      g.cornerRadius = dp(24).toFloat()
                      c.background = g
                      c.elevation = dp(6).toFloat()
                  } else {
                      val g = bg(cardC, 24)
                      g.setStroke(dp(2), ac)
                      c.background = g
                  }
                  val tc = if (filled) Color.WHITE else txt
                  val sc = if (filled) 0xCCFFFFFF.toInt() else sub
                  c.addView(tv(e, 36f, tc, false))
                  c.addView(tv(t, 22f, tc, true))
                  c.addView(tv(s, 13f, sc, false))
                  c.isClickable = true
                  c.setOnClickListener { onClick() }
                  return c
              }

              private fun buildUi() {
                  val dark = isDark()
                  val bgC = if (dark) 0xFF0F1419.toInt() else 0xFFF3F6FA.toInt()
                  val cardC = if (dark) 0xFF1A222C.toInt() else Color.WHITE
                  val txt = if (dark) 0xFFEAF0F6.toInt() else 0xFF14202B.toInt()
                  val sub = if (dark) 0xFF8FA1B3.toInt() else 0xFF5B6B7B.toInt()
                  val ac = accent()
                  window.statusBarColor = bgC
                  window.navigationBarColor = bgC
                  if (Build.VERSION.SDK_INT >= 23) {
                      var f = window.decorView.systemUiVisibility
                      f = if (dark) f and View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR.inv()
                          else f or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                      window.decorView.systemUiVisibility = f
                  }
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(bgC)
                  sv.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(28), dp(20), dp(28))
                  sv.addView(root)

                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  val tb = LinearLayout(this)
                  tb.orientation = LinearLayout.VERTICAL
                  tb.addView(tv("نقل سريع", 30f, txt, true))
                  tb.addView(tv("أرسل أي ملف بأقصى سرعة عبر Wi-Fi Direct", 13f, sub, false))
                  head.addView(tb, LinearLayout.LayoutParams(0, WRAP, 1f))
                  val chip = tv(if (dark) "☀️ فاتح" else "🌙 داكن", 14f, txt, true)
                  chip.setPadding(dp(14), dp(8), dp(14), dp(8))
                  chip.background = bg(cardC, 20)
                  chip.setOnClickListener {
                      prefs().edit().putInt("dark", if (dark) 0 else 1).apply()
                      buildUi()
                  }
                  head.addView(chip)
                  root.addView(head)

                  root.addView(action("📤", "إرسال ملفات", "اختر ملفات من جوالك وأرسلها للجهاز الآخر",
                      true, cardC, txt, sub) { withPerms { pickFiles() } }, lp(MATCH, WRAP, 28))
                  root.addView(action("📥", "استقبال ملفات", "اجعل جوالك جاهزاً لاستقبال الملفات",
                      false, cardC, txt, sub) { withPerms { startReceive() } }, lp(MATCH, WRAP, 16))

                  val sc = LinearLayout(this)
                  sc.orientation = LinearLayout.VERTICAL
                  sc.setPadding(dp(20), dp(20), dp(20), dp(20))
                  sc.background = bg(cardC, 24)
                  status = tv(statusText, 16f, txt, false)
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100
                  bar.progress = progressVal
                  bar.progressTintList = ColorStateList.valueOf(ac)
                  bar.progressBackgroundTintList = ColorStateList.valueOf(
                      if (dark) 0xFF2B3744.toInt() else 0xFFDDE5EE.toInt())
                  speed = tv(speedText, 30f, ac, true)
                  sc.addView(tv("الحالة", 12f, sub, false))
                  sc.addView(status, lp(MATCH, WRAP, 4))
                  sc.addView(bar, lp(MATCH, dp(10), 14))
                  sc.addView(speed, lp(MATCH, WRAP, 10))
                  root.addView(sc, lp(MATCH, WRAP, 16))

                  root.addView(tv("لون التطبيق", 12f, sub, false), lp(WRAP, WRAP, 24))
                  val dots = LinearLayout(this)
                  dots.orientation = LinearLayout.HORIZONTAL
                  val sel = prefs().getInt("acc", 0)
                  for (i in accents.indices) {
                      val d = View(this)
                      val g = GradientDrawable()
                      g.shape = GradientDrawable.OVAL
                      g.setColor(accents[i])
                      if (i == sel) g.setStroke(dp(3), txt)
                      d.background = g
                      d.setOnClickListener {
                          prefs().edit().putInt("acc", i).apply()
                          buildUi()
                      }
                      val p = LinearLayout.LayoutParams(dp(38), dp(38))
                      p.marginEnd = dp(12)
                      dots.addView(d, p)
                  }
                  root.addView(dots, lp(WRAP, WRAP, 10))
                  setContentView(sv)
              }

              private fun pickFiles() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  startActivityForResult(i, 1)
              }

              private fun perms(): Array<String> {
                  val l = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT <= 32) l.add("android.permission.ACCESS_FINE_LOCATION")
                  if (Build.VERSION.SDK_INT >= 31) {
                      l.add("android.permission.BLUETOOTH_ADVERTISE")
                      l.add("android.permission.BLUETOOTH_CONNECT")
                      l.add("android.permission.BLUETOOTH_SCAN")
                  }
                  if (Build.VERSION.SDK_INT >= 33) l.add("android.permission.NEARBY_WIFI_DEVICES")
                  if (Build.VERSION.SDK_INT <= 28) l.add("android.permission.WRITE_EXTERNAL_STORAGE")
                  return l.toTypedArray()
              }

              private fun withPerms(a: () -> Unit) {
                  pending = a
                  requestPermissions(perms(), 7)
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(c, p, r)
                  if (c == 7) {
                      val a = pending
                      pending = null
                      a?.invoke()
                  }
              }

              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  super.onActivityResult(rc, res, d)
                  if (rc != 1 || res != RESULT_OK || d == null) return
                  val l = ArrayList<Uri>()
                  val cd = d.clipData
                  if (cd != null) {
                      for (i in 0 until cd.itemCount) l.add(cd.getItemAt(i).uri)
                  } else if (d.data != null) {
                      l.add(d.data!!)
                  }
                  picked = l
                  startSend()
              }

              private fun st(s: String) {
                  statusText = s
                  status.text = s
              }

              private fun startReceive() {
                  sending = false
                  reset()
                  client.startAdvertising(Build.MODEL, svc, conn,
                      AdvertisingOptions.Builder().setStrategy(strat).build())
                      .addOnSuccessListener { st("بانتظار الجهاز المرسل...") }
                      .addOnFailureListener { st("خطأ: " + it.message) }
              }

              private fun startSend() {
                  sending = true
                  reset()
                  client.startDiscovery(svc, disc,
                      DiscoveryOptions.Builder().setStrategy(strat).build())
                      .addOnSuccessListener { st("جاري البحث عن الجهاز المستقبل...") }
                      .addOnFailureListener { st("خطأ: " + it.message) }
              }

              private fun reset() {
                  t0 = 0L
                  prog.clear()
                  names.clear()
                  files.clear()
                  done.clear()
                  sentIds.clear()
                  progressVal = 0
                  speedText = ""
                  bar.progress = 0
                  speed.text = ""
              }

              private val disc = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(id: String, i: DiscoveredEndpointInfo) {
                      client.requestConnection(Build.MODEL, id, conn)
                  }
                  override fun onEndpointLost(id: String) {}
              }

              private val conn = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(id: String, i: ConnectionInfo) {
                      client.acceptConnection(id, pcb)
                  }
                  override fun onConnectionResult(id: String, r: ConnectionResolution) {
                      if (r.status.isSuccess) {
                          client.stopDiscovery()
                          client.stopAdvertising()
                          st("تم الاتصال ✓")
                          if (sending) sendAll(id)
                      } else {
                          st("فشل الاتصال")
                      }
                  }
                  override fun onDisconnected(id: String) { st("انقطع الاتصال") }
              }

              private fun nameOf(u: Uri): String {
                  contentResolver.query(u, null, null, null, null)?.use { c ->
                      if (c.moveToFirst()) {
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0) return c.getString(i)
                      }
                  }
                  return "file_" + System.currentTimeMillis()
              }

              private fun sendAll(ep: String) {
                  for (u in picked) {
                      val pfd = contentResolver.openFileDescriptor(u, "r") ?: continue
                      val fp = Payload.fromFile(pfd)
                      sentIds.add(fp.id)
                      val meta = fp.id.toString() + "|" + nameOf(u)
                      client.sendPayload(ep, Payload.fromBytes(meta.toByteArray()))
                      client.sendPayload(ep, fp)
                  }
                  st("جاري الإرسال...")
              }

              private val pcb = object : PayloadCallback() {
                  override fun onPayloadReceived(id: String, p: Payload) {
                      if (p.type == Payload.Type.BYTES) {
                          val s = String(p.asBytes()!!)
                          val k = s.indexOf('|')
                          val pid = s.substring(0, k).toLong()
                          names[pid] = s.substring(k + 1)
                          trySave(pid)
                      } else if (p.type == Payload.Type.FILE) {
                          files[p.id] = p
                      }
                  }

                  override fun onPayloadTransferUpdate(id: String, u: PayloadTransferUpdate) {
                      if (t0 == 0L) t0 = System.currentTimeMillis()
                      prog[u.payloadId] = u.bytesTransferred
                      if (u.totalBytes > 0) {
                          progressVal = (u.bytesTransferred * 100 / u.totalBytes).toInt()
                          bar.progress = progressVal
                      }
                      val sec = (System.currentTimeMillis() - t0) / 1000.0 + 0.001
                      val mb = prog.values.sum() / 1048576.0
                      speedText = String.format("%.1f MB/s", mb / sec)
                      speed.text = speedText
                      if (u.status == PayloadTransferUpdate.Status.SUCCESS) {
                          if (sentIds.remove(u.payloadId) && sentIds.isEmpty()) st("تم الإرسال بنجاح ✓")
                          if (files.containsKey(u.payloadId)) {
                              done.add(u.payloadId)
                              trySave(u.payloadId)
                          }
                      } else if (u.status == PayloadTransferUpdate.Status.FAILURE) {
                          st("فشل النقل")
                      }
                  }
              }

              private fun trySave(pid: Long) {
                  if (!done.contains(pid) || !names.containsKey(pid) || !files.containsKey(pid)) return
                  val p = files[pid]!!
                  val name = names[pid]!!
                  st("جاري حفظ: " + name)
                  Thread {
                      try {
                          val src = contentResolver.openInputStream(p.asFile()!!.asUri()!!)!!
                          val out: OutputStream
                          if (Build.VERSION.SDK_INT >= 29) {
                              val cv = ContentValues()
                              cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                              cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/FastShare")
                              val u = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)!!
                              out = contentResolver.openOutputStream(u)!!
                          } else {
                              val d = File(Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS), "FastShare")
                              d.mkdirs()
                              out = FileOutputStream(File(d, name))
                          }
                          src.use { i -> out.use { o -> i.copyTo(o, 1 shl 20) } }
                          runOnUiThread { st("تم الحفظ في: Download/FastShare ✓") }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this, "خطأ حفظ: " + e.message, Toast.LENGTH_LONG).show() }
                      }
                  }.start()
              }
          }
          EOF6
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FastShare-APK
          path: app/build/outputs/apk/debug/app-debug.apk
